  <line x1="0" y1="560" x2="900" y2="560" stroke="#e2ddd3" stroke-width="1"/>
  <text x="46" y="592" font-size="12" fill="#9a927f">© 2026 Cozy Bean Coffee. Mọi quyền được bảo lưu.</text>
