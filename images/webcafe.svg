<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="heroGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6ead9"/>
      <stop offset="100%" stop-color="#eddcc4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="900" height="620" fill="#ffffff"/>
  <rect x="0" y="0" width="900" height="620" fill="none" stroke="#e2ddd3" stroke-width="2"/>

  <!-- Nav bar -->
  <rect x="0" y="0" width="900" height="64" fill="#ffffff"/>
  <line x1="0" y1="64" x2="900" y2="64" stroke="#e2ddd3" stroke-width="1"/>
  <circle cx="46" cy="32" r="14" fill="#f0c46b"/>
  <text x="46" y="37" font-size="14" text-anchor="middle" fill="#8a5a1e">☕</text>
  <text x="70" y="37" font-size="17" font-weight="bold" fill="#3a2c1a">Cozy Bean</text>

  <text x="560" y="37" font-size="13" fill="#6b6558">Trang chủ</text>
  <text x="650" y="37" font-size="13" fill="#6b6558">Thực đơn</text>
  <text x="735" y="37" font-size="13" fill="#6b6558">Không gian</text>
  <text x="825" y="37" font-size="13" fill="#6b6558">Liên hệ</text>

  <!-- Hero section -->
  <rect x="0" y="64" width="520" height="270" fill="#ffffff"/>
  <text x="46" y="140" font-size="12" font-weight="bold" fill="#b5791f">QUÁN CÀ PHÊ THỦ CÔNG</text>
  <text x="46" y="178" font-size="30" font-weight="bold" fill="#2c2216">Cozy Bean Coffee</text>
  <text x="46" y="212" font-size="13" fill="#6b6558">Không gian ấm cúng, cà phê rang xay mỗi ngày,</text>
  <text x="46" y="232" font-size="13" fill="#6b6558">chỗ ngồi lý tưởng để làm việc hoặc gặp gỡ bạn bè.</text>

  <rect x="46" y="256" width="130" height="38" rx="4" fill="#f0c46b"/>
  <text x="111" y="280" font-size="13" font-weight="bold" fill="#3a2c1a" text-anchor="middle">Xem thực đơn</text>

  <rect x="188" y="256" width="100" height="38" rx="4" fill="#ffffff" stroke="#d8d2c4" stroke-width="1"/>
  <text x="238" y="280" font-size="13" fill="#3a2c1a" text-anchor="middle">Đặt bàn</text>

  <!-- Hero image block -->
  <rect x="520" y="64" width="380" height="270" fill="url(#heroGrad)"/>
  <text x="710" y="215" font-size="70" text-anchor="middle">☕</text>

  <!-- Featured section -->
  <line x1="0" y1="334" x2="900" y2="334" stroke="#e2ddd3" stroke-width="1"/>
  <text x="46" y="372" font-size="13" font-weight="bold" fill="#6b6558">MÓN NỔI BẬT</text>

  <!-- Card 1 -->
  <rect x="46" y="392" width="250" height="130" rx="8" fill="#faf6ef"/>
  <text x="171" y="440" font-size="30" text-anchor="middle">☕</text>
  <text x="171" y="470" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c2216">Cà phê sữa đá</text>
  <text x="171" y="492" font-size="12" text-anchor="middle" fill="#9a927f">29.000đ</text>

  <!-- Card 2 -->
  <rect x="325" y="392" width="250" height="130" rx="8" fill="#faf6ef"/>
  <text x="450" y="440" font-size="30" text-anchor="middle">🥛</text>
  <text x="450" y="470" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c2216">Bạc xỉu</text>
  <text x="450" y="492" font-size="12" text-anchor="middle" fill="#9a927f">32.000đ</text>

  <!-- Card 3 -->
  <rect x="604" y="392" width="250" height="130" rx="8" fill="#faf6ef"/>
  <text x="729" y="440" font-size="30" text-anchor="middle">🥐</text>
  <text x="729" y="470" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c2216">Bánh croissant</text>
  <text x="729" y="492" font-size="12" text-anchor="middle" fill="#9a927f">25.000đ</text>

